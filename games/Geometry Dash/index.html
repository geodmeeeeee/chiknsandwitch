async function fetchWithProgress(url) {
    let response;
    let assetCache = null;
    let fromCache = false;
    try {
        if (window.caches) {
            assetCache = await caches.open(GD_ASSET_CACHE);
            response = await assetCache.match(url);
            fromCache = !!response;
        }
    } catch (e) {
        assetCache = null;
        response = null;
    }
    if (!response) {
        response = await fetch(url, {
            cache: 'no-store'
        });
    }
    if (!response.ok) throw new Error(url + ' HTTP ' + response.status);
    const chunks = [];
    let received = 0;

    function appendChunk(value) {
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        updateLoadingPercent();
    }
    if (response.body && response.body.getReader) {
        const reader = response.body.getReader();
        try {
            while (true) {
                const {
                    done,
                    value
                } = await reader.read();
                if (done) break;
                appendChunk(value);
            }
        } finally {
            reader.releaseLock();
        }
    } else {
        appendChunk(new Uint8Array(await response.arrayBuffer()));
    }
    const fullBuffer = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
    }
    if (!fromCache && assetCache) {
        try {
            await assetCache.put(url, new Response(fullBuffer));
        } catch (e) {}
    }
    return fullBuffer.buffer;
}

function gdLoadSplitFile(which, onProgress) {

    var base = which === 'wasm' ?
        'gd_web.wasm' :
        'gd_web.data';

    var count = GD_SPLIT_COUNTS[which];

    var chunks = new Array(count);
    var loaded = 0;

    var nextPart = 1;

    function loadParts() {

        var i = nextPart++;

        if (i > count)
            return Promise.resolve();

        var url = base + '.part' + String(i).padStart(3, '0');

        say('[' + which + '] loading ' + url);

        return fetchWithProgress(url).then(function(buf) {

            chunks[i - 1] = new Uint8Array(buf);

            loaded += chunks[i - 1].byteLength;

            if (onProgress)
                onProgress(loaded, GD_SIZE_HINT[which]);

            return loadParts();
        });
    }

    var workers = [];

    for (var w = 0; w < Math.min(4, count); w++)
        workers.push(loadParts());

    return Promise.all(workers).then(function() {

        var total = 0;

        for (var x = 0; x < chunks.length; x++)
            total += chunks[x].byteLength;

        var combined = new Uint8Array(total);
        var offset = 0;

        for (var y = 0; y < chunks.length; y++) {
            combined.set(chunks[y], offset);
            offset += chunks[y].byteLength;
        }

        return combined.buffer;
    });
}

function setAssetBar(which, loaded, total) {

    var fill =
        which === 'wasm' ?
        wasmFill :
        dataFill;

    var pctEl =
        which === 'wasm' ?
        wasmPct :
        dataPct;

    var label =
        which === 'wasm' ?
        wasmLabel :
        dataLabel;

    if (!fill) return;

    var name =
        which === 'wasm' ?
        'WASM' :
        'DATA';

    var learned = gdLearnedSize(which);

    var hint = gdSizeHint(which);

    var known = hint > 0 ?
        hint :
        (learned > 0 ?
            learned :
            (total > 0 ?
                total :
                0));

    var exact = known > 0;

    if (label) {

        label.textContent =
            name + ' (' +
            (exact ? '' : '~') +
            gdFmtSize(known > 0 ?
                known :
                (which === 'wasm' ?
                    110 * 1024 * 1024 :
                    320 * 1024 * 1024)) +
            ')';
    }

    var p;

    if (known > 0)
        p = Math.min(100, loaded / known * 100);
    else {

        var est =
            which === 'wasm' ?
            110 * 1024 * 1024 :
            320 * 1024 * 1024;

        p = Math.min(95, loaded / est * 95);
    }

    fill.style.width = p.toFixed(1) + '%';

    if (loaded <= 0)
        pctEl.textContent = '0%';

    else if (known > 0)
        pctEl.textContent =
        p.toFixed(0) + '% (' +
        gdFmtSize(loaded) + ')';

    else
        pctEl.textContent = gdFmtSize(loaded);

    if (known > 0 && loaded >= known) {

        gdAssetDone[which] = true;

        try {

            localStorage.setItem(
                which === 'wasm' ?
                'gdWasmSize' :
                'gdDataSize',
                String(Math.max(loaded, known))
            );

        } catch (e) {}
    }

    if (gdAssetDone.wasm && gdAssetDone.data)
        assetsDone();
}

    if (gdProgDone && p < 100)

    if (bootFill)
        bootFill.style.width = p.toFixed(1) + '%';

    if (bootPct)
        bootPct.textContent = p.toFixed(0) + '%';

    if (p >= 100) {

        bootDone();
    }

var gdSaveSigs = {};

    try {

            if (!Module.FS.isFile(st.mode)) continue;
            var sig = st.size + ':' + (+st.mtime);

            batch.push({ key: 'AppData/' + n, path: p, sig: sig, data: Module.FS.readFile(p) });

        if (!batch.length) return;
        var req = indexedDB.open('gdwasm_saves', 1);

            if (!req.result.objectStoreNames.contains('files'))
                req.result.createObjectStore('files');

        req.onsuccess = function() {

            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            batch.forEach(function(b) { store.put(b.data, b.key); });
            tx.oncomplete = function() {
                batch.forEach(function(b) { gdSaveSigs[b.path] = b.sig; });

                            new Uint8Array(value.buffer, value.byteOffset, value.byteLength) :
                            new Uint8Array(value);

                        var dir = '';
                        for (var i = 1; i < parts.length - 1; i++) {

                        say('[persist] restore failed: ' + e);
                    }
                    entry.continue();
                };
            } catch (e) {
                say('[persist] restore failed: ' + e);
