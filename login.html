<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Password required to access the game library">
  <title>Enter Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="access-page">
    <form id="accessForm" class="access-panel">
      <h1>Enter password</h1>
      <label for="sitePassword">Password</label>
      <input id="sitePassword" name="password" type="password" autocomplete="current-password" required autofocus>
      <p id="accessError" class="access-error" role="alert" hidden>That password is not correct.</p>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="access.js"></script>
</body>
</html>
