<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A collection of games to play.">
  <title>Geo Games</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="status-bar">
      <time id="localClock" class="local-clock" aria-live="polite" aria-atomic="true"></time>
      <div class="battery-indicator" aria-live="polite" aria-atomic="true" aria-label="Battery status">
        <span class="battery-icon" aria-hidden="true"><span id="batteryFill" class="battery-fill"></span></span>
        <span id="batteryLevel" class="battery-level">--%</span>
      </div>
    </div>
    <nav class="top-navigation" aria-label="Main navigation">
      <button class="navigation-tab" type="button" data-view="settings" aria-controls="settingsView">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></svg>
        <span>Settings</span>
      </button>
      <button class="navigation-tab is-active" type="button" data-view="home" aria-controls="homeView" aria-current="page">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>Main Menu</span>
      </button>
      <button class="navigation-tab" type="button" data-view="games" aria-controls="gamesView">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>
        <span>All Games</span>
      </button>
    </nav>

    <section id="homeView" class="page-view home-view" aria-label="Geo Games">
      <div class="home-heading">
        <h1>Geo Games</h1>
        <p class="home-description">The best Game site</p>
      </div>
      <div id="homeGames" class="home-games" role="region" aria-label="Most popular games" tabindex="0"></div>
      <nav class="home-links" aria-label="More links">
        <a class="home-link-button" href="https://docs.google.com/document/d/1_Y_XT89vl8wsBxNv-bgE95F5OZce1Vwb1kH97pKWl2o/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
          <img class="home-link-icon" src="https://www.gstatic.com/images/branding/product/1x/docs_2020q4_48dp.png" alt="" aria-hidden="true">
          <span>Show all links</span>
        </a>
        <a class="home-link-button" href="https://forms.gle/e8qHD2dKxWxFEm2m7" target="_blank" rel="noopener noreferrer">
          <img class="home-link-icon" src="https://www.gstatic.com/images/branding/product/1x/forms_2020q4_48dp.png" alt="" aria-hidden="true">
          <span>Bugs / Suggestions</span>
        </a>
        <a class="home-link-button donate-button" href="https://ko-fi.com/" target="_blank" rel="noopener noreferrer">
          <img class="home-link-icon" src="images/Ko-Fi.webp" alt="" aria-hidden="true">
          <span>Donate</span>
        </a>
      </nav>
      <p class="donation-note">Your donations make updating the site possible.</p>
    </section>

    <section id="settingsView" class="page-view settings-view" aria-label="Settings" hidden>
      <div class="view-heading">
        <p class="eyebrow">PREFERENCES</p>
        <h1>Settings</h1>
      </div>
      <div class="settings-list">
        <label class="setting-row" for="darkMode">
          <span class="setting-copy"><strong>Dark mode</strong><span>Use the blackish grayscale theme.</span></span>
          <input id="darkMode" class="switch-input" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="setting-row" for="reduceMotion">
          <span class="setting-copy"><strong>Reduce motion</strong><span>Limit animations throughout the library.</span></span>
          <input id="reduceMotion" class="switch-input" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="setting-row" for="clockEnabled">
          <span class="setting-copy"><strong>Show clock</strong><span>Display the live local time in the top-right corner.</span></span>
          <input id="clockEnabled" class="switch-input" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="setting-row" for="batteryEnabled">
          <span class="setting-copy"><strong>Show battery</strong><span>Display the current device battery percentage next to the clock.</span></span>
          <input id="batteryEnabled" class="switch-input" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <section id="gamesView" class="page-view games-view" aria-label="All games" hidden>
    <div class="search-toolbar">
      <div class="search-wrap">
        <label class="sr-only" for="search">Search games</label>
        <input id="search" type="search" placeholder="Search games..." autocomplete="off">
        <span class="search-icon" aria-hidden="true">⌕</span>
      </div>
      <div class="filter-control">
        <button id="filterToggle" class="filter-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="filterPanel">Filter</button>
        <dialog id="filterPanel" class="filter-dialog" aria-labelledby="filterHeading">
          <div class="filter-dialog-header">
            <h2 id="filterHeading">Categories</h2>
            <button id="filterClose" class="filter-close" type="button">Close</button>
          </div>
          <fieldset>
            <legend class="sr-only">Choose categories</legend>
            <div id="filterOptions" class="filter-options"></div>
          </fieldset>
          <div class="filter-actions">
            <button id="clearFilters" class="clear-filters" type="button">Clear filters</button>
            <button id="filterDone" class="filter-done" type="button">Done</button>
          </div>
        </dialog>
      </div>
    </div>

    <div id="gameGrid" class="game-grid" aria-live="polite"></div>

    <nav id="pagination" class="pagination" aria-label="Game pages" hidden>
      <button id="previousPage" class="page-arrow" type="button" aria-label="Previous page">Previous</button>
      <div id="pageNumbers" class="page-numbers" aria-label="Pages"></div>
      <button id="nextPage" class="page-arrow" type="button" aria-label="Next page">Next</button>
      <div class="page-jump">
        <label for="pageInput">Go to page</label>
        <input id="pageInput" type="number" min="1" value="1" required>
        <span id="pageCount">of 1</span>
      </div>
    </nav>

    <div id="emptyState" class="empty-state" hidden>No games found.</div>
    </section>

    <dialog id="gamePlayer" class="game-player-dialog" aria-labelledby="gamePlayerTitle">
      <div class="game-player-header">
        <h2 id="gamePlayerTitle"></h2>
        <div class="game-player-actions">
          <button id="gameMute" class="game-player-button" type="button" aria-label="Mute game" title="Mute game">
            <svg id="gameMuteIcon" class="game-mute-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <g class="speaker-unmuted">
                <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                <path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7 7 0 0 1 0 10" />
              </g>
              <g class="speaker-muted">
                <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                <path d="M16 9l4 6M20 9l-4 6" />
              </g>
            </svg>
          </button>
          <button id="gameFullscreen" class="game-player-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3" />
            </svg>
          </button>
          <button id="gamePlayerClose" class="game-player-button" type="button" aria-label="Close game" title="Close game">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </div>
      <div class="game-player-frame">
        <div id="gameFrameLoader" class="game-frame-loader is-hidden" aria-live="polite" aria-label="Loading game">
          <span class="loading-spinner" aria-hidden="true"></span>
        </div>
        <iframe id="gameFrame" title="Game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
      </div>
    </dialog>
  </main>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
